<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Site.Params.description }}{{ . }}{{ end }}{{ end }}">

<!-- Open Graph -->
<meta property="og:title" content="{{ .Title }}" />
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Site.Params.description }}{{ . }}{{ end }}{{ end }}" />
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}" />
<meta property="og:url" content="{{ .Permalink }}" />
{{ $image := .Resources.GetMatch "bg.*" }}
{{ if $image }}
    <meta property="og:image" content="{{ $image.Permalink }}" />
{{ else }}
    <meta property="og:image" content="{{ "images/doraemon.jpg" | absURL }}" />
{{ end }}


<!-- Twitter Cards -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ .Title }}" />
<meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Site.Params.description }}{{ . }}{{ end }}{{ end }}" />
{{ if $image }}
    <meta name="twitter:image" content="{{ $image.Permalink }}" />
{{ else }}
    <meta name="twitter:image" content="{{ "images/doraemon.jpg" | absURL }}" />
{{ end }}
